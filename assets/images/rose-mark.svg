<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title desc">
  <title id="title">Liquid glass circular mark</title>
  <desc id="desc">A circular liquid glass icon with soft highlights and layered translucent reflections.</desc>
  <defs>
    <radialGradient id="orb-fill" cx="34%" cy="28%" r="78%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.98"/>
      <stop offset="38%" stop-color="#eef7ff" stop-opacity="0.88"/>
      <stop offset="70%" stop-color="#c7ddf0" stop-opacity="0.74"/>
      <stop offset="100%" stop-color="#9fb9d0" stop-opacity="0.88"/>
    </radialGradient>
    <linearGradient id="rim-stroke" x1="22" y1="18" x2="103" y2="110" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.92"/>
      <stop offset="46%" stop-color="#dce9f5" stop-opacity="0.46"/>
      <stop offset="100%" stop-color="#86a5bf" stop-opacity="0.7"/>
    </linearGradient>
    <linearGradient id="flow-a" x1="34" y1="30" x2="80" y2="94" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.82"/>
      <stop offset="100%" stop-color="#bfd7ea" stop-opacity="0.12"/>
    </linearGradient>
    <linearGradient id="flow-b" x1="92" y1="42" x2="52" y2="103" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#d8ebfb" stop-opacity="0.72"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.14"/>
    </linearGradient>
    <filter id="soft-shadow" x="-24%" y="-24%" width="148%" height="148%">
      <feDropShadow dx="0" dy="9" stdDeviation="9" flood-color="#6c8ca8" flood-opacity="0.24"/>
    </filter>
    <filter id="inner-blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.4"/>
    </filter>
    <clipPath id="orb-clip">
      <circle cx="64" cy="64" r="46"/>
    </clipPath>
  </defs>

  <g filter="url(#soft-shadow)">
    <circle cx="64" cy="64" r="46" fill="url(#orb-fill)"/>
    <circle cx="64" cy="64" r="46" fill="none" stroke="url(#rim-stroke)" stroke-width="2.4"/>

    <g clip-path="url(#orb-clip)">
      <path
        d="M30 67c9-12 25-16 39-13 11 2 18 8 28 8 11 0 18-5 31-4v34H30Z"
        fill="#7fa7c6"
        fill-opacity="0.22"
      />
      <path
        d="M34 78c8-6 17-9 27-9 11 0 17 6 27 6 9 0 17-4 26-3"
        fill="none"
        stroke="url(#flow-b)"
        stroke-width="12"
        stroke-linecap="round"
        filter="url(#inner-blur)"
      />
      <path
        d="M38 33c7-9 22-14 35-11 8 2 15 7 18 14 2 5 0 10-7 12-8 3-14 2-21 6-7 4-10 10-21 10-9 0-16-4-18-11-2-8 5-15 14-20Z"
        fill="url(#flow-a)"
        fill-opacity="0.85"
      />
      <path
        d="M84 31c9 4 14 12 14 20 0 7-4 13-11 17-8 5-19 5-25 11-4 4-6 9-14 13"
        fill="none"
        stroke="#ffffff"
        stroke-opacity="0.52"
        stroke-width="7"
        stroke-linecap="round"
        filter="url(#inner-blur)"
      />
      <ellipse cx="52" cy="43" rx="24" ry="15" transform="rotate(-22 52 43)" fill="#ffffff" fill-opacity="0.46"/>
      <ellipse cx="79" cy="88" rx="18" ry="11" transform="rotate(-18 79 88)" fill="#8fb5d2" fill-opacity="0.18"/>
      <path
        d="M39 25c5-5 14-9 24-9 9 0 18 3 23 7"
        fill="none"
        stroke="#ffffff"
        stroke-opacity="0.88"
        stroke-width="5"
        stroke-linecap="round"
      />
      <path
        d="M36 41c8 4 16 4 22 2"
        fill="none"
        stroke="#ffffff"
        stroke-opacity="0.7"
        stroke-width="4"
        stroke-linecap="round"
      />
    </g>

    <circle cx="64" cy="64" r="46" fill="none" stroke="#ffffff" stroke-opacity="0.3" stroke-width="1"/>
  </g>
</svg>
